<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team planner</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <header><h1>Team planner</h1><nav aria-label="Main"><a href="/">Projects</a></nav></header>
  <div id="notice" role="status" aria-live="polite"></div>
  <div id="error" role="alert" tabindex="-1" hidden></div>
  <button id="reload" type="button">Reload latest</button>
  <div class="layout">
    <aside aria-label="Projects">
      <h2>Projects</h2>
      <form id="project-form">
        <label for="project-name">Project name</label>
        <input id="project-name" name="name" required>
        <button type="submit">Create project</button>
      </form>
      <ul id="projects"></ul>
    </aside>
    <main id="main" aria-busy="true"></main>
  </div>
</body>
</html>
